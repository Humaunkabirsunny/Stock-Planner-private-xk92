const TIPS = [
  { title: "Prompt format (the qualifier suffix)", body: "Every prompt should end with quality qualifiers: 'award-winning' or 'premium' + style word (editorial/isometric/3D/digital) + 'sophisticated color grading, polished professional vector art, balanced eye-catching composition, no text, no signage, no lettering, 16:9'. Dropping this suffix noticeably hurt output quality in testing." },
  { title: "Glassmorphism: avoid generic swirls", body: "A plain twisting ribbon/vortex with no recognizable object gets rejected. Every glass prompt must form a CLEARLY RECOGNIZABLE object (animal, flower, object) and explicitly say 'not a generic abstract swirl, sharply defined [object] silhouette'." },
  { title: "People in illustrations: copyright safety", body: "AI often reproduces a training photo's real face/body parts closely enough to trigger copyright claims. Add 'stylized fictional character with simplified generic features' to every prompt with a person. Keep faces non-specific/stylized, never photoreal." },
  { title: "Recognizable property & tech products", body: "A specific real building, office interior, or tech product shape can trigger claims even with 'created with generative AI' checked. For tech prompts, always add 'no logos, no screen UI' to the suffix." },
  { title: "Keyword/title strategy for search ranking", body: "Lead titles and keywords with the SPECIFIC noun (e.g. 'koi fish', 'maple leaf') not a generic category word. Narrow/specific phrases rank on page 1; broad generic phrases ('3d glass sculpture concept') have too much competition." },
  { title: "CSV category mapping", body: "Metaphor/animal concept -> 3 (Business) or 6 (State of Mind). Glassmorphism -> 8 (Graphic Resources). Lifestyle/isometric scenes -> 12 (Lifestyle), or 14 (Plants/Flowers) for gardening, 7 (Food) for cooking, 18 (Sport), 20 (Transport), 17 (Social Issues) for charity/donation. Technology -> 19. Wellness/metaphor -> 6." },
  { title: "File naming", body: "Use .jpeg extension (not .jpg) to match what's expected on upload. Each batch gets its own short prefix (e.g. 'knotlume1-', 'events1-') followed by a number." },
  { title: "Event timing rule", body: "Upload seasonal/event content at least 20-90 days before the date, to allow for Adobe's review lag. Skip events closer than ~15-20 days away; it's often too late by the time of approval." },
  { title: "Sensitive topics to skip in quick batches", body: "Avoid World AIDS Day, Gender-Based Violence awareness, and similarly sensitive health/social topics in fast, high-volume batches. These deserve careful, dedicated treatment, not assembly-line prompts." },
  { title: "Abstract 3D render differentiation", body: "Material change alone (ice, metal, silk) isn't enough to stand out in the saturated abstract-render market. The real differentiator is SHAPE TOPOLOGY (a tangled knot, faceted cluster, fracture) combined with unusual light-behavior (prism-split, caustic, internal glow) rather than a plain smooth curve." },
  { title: "Copy-space composition", body: "Many top-selling abstract/background assets leave an empty, uncluttered area in the frame on purpose — buyers use that space to place their own text or logo. Worth adding 'large empty copy-space area' to abstract background prompts." },

function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}

const SYNC_KEYS = ['stockplanner_entries', 'stockplanner_custom_events', 'stockplanner_done'];
let dbDocRef = null;
let cloudStatus = 'checking'; // 'checking' | 'connected' | 'unavailable'

function saveJSON(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e) {}
  if (SYNC_KEYS.indexOf(key) !== -1) { syncToCloud(); }
}

function syncToCloud() {
  if (!dbDocRef) return;
  const payload = {
    entries: loadJSON('stockplanner_entries', []),
    custom_events: loadJSON('stockplanner_custom_events', []),
    done: loadJSON('stockplanner_done', {})
  };
  dbDocRef.set(payload).catch(function(e) { /* transient — local copy is still safe */ });
}

async function initCloudSync() {
  try {
    const db = await claude.use("db");
    const user = await claude.use("user");
    if (!db || !user) { cloudStatus = 'unavailable'; return; }
    const id = await user.id();
    if (!id) { cloudStatus = 'unavailable'; return; }
    dbDocRef = db.doc("data/users/" + id + "/planner");
    const snap = await dbDocRef.get();
    if (snap.exists) {
      const data = snap.data() || {};
      if (data.entries) { try { localStorage.setItem('stockplanner_entries', JSON.stringify(data.entries)); } catch(e){} }
      if (data.custom_events) { try { localStorage.setItem('stockplanner_custom_events', JSON.stringify(data.custom_events)); } catch(e){} }
      if (data.done) { try { localStorage.setItem('stockplanner_done', JSON.stringify(data.done)); } catch(e){} }
    } else {
      syncToCloud();
    }
    cloudStatus = 'connected';
  } catch(e) {
    cloudStatus = 'unavailable';
  }
  const activeTab = document.querySelector('.tab.active');
  if (activeTab) render(activeTab.getAttribute('data-tab'));
}

function getAllEvents() {
  const custom = loadJSON('stockplanner_custom_events', []);
  return BUILTIN_EVENTS.map(function(e){ return Object.assign({builtin:true}, e); })
    .concat(custom.map(function(e){ return Object.assign({builtin:false}, e); }));
}

function getAllTrackOptions() {
  const custom = loadJSON('stockplanner_custom_events', []);
  const eventNames = custom.map(function(e){ return e.name; });
  const builtinEventNames = BUILTIN_EVENTS.map(function(e){ return e.name; });
  const batchNames = BATCHES.map(function(b){ return b.name; });
  const all = batchNames.concat(BASE_NICHE_NAMES).concat(builtinEventNames).concat(eventNames);
  return all.filter(function(v,i){ return all.indexOf(v) === i; });
}

function incrementGenerated(niche) {
  const today = new Date().toISOString().slice(0,10);
  const entries = loadJSON('stockplanner_entries', []);
  let entry = entries.find(function(e){ return e.niche === niche && e.date === today && e.autoGenerated; });
  if (!entry) {
    entry = { niche: niche, date: today, generated: 0, approved: 0, rejected: 0, sales: 0, earnings: 0, note: 'auto-tallied from Batches copy', autoGenerated: true };
    entries.push(entry);
  }
  entry.generated += 1;
  saveJSON('stockplanner_entries', entries);
  return entry.generated;
}

function todaysAutoCount(niche) {
  const today = new Date().toISOString().slice(0,10);
  const entries = loadJSON('stockplanner_entries', []);
  const entry = entries.find(function(e){ return e.niche === niche && e.date === today && e.autoGenerated; });
  return entry ? entry.generated : 0;
}

function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr);
  return Math.round((target - today) / 86400000);
}

function urgencyBadge(days) {
  if (days < 0) return '<span class="badge done">passed</span>';
  if (days <= 30) return '<span class="badge urgent">' + days + 'd left</span>';
  if (days <= 60) return '<span class="badge soon">' + days + 'd left</span>';
  return '<span class="badge later">' + days + 'd left</span>';
}

function rateBadge(rate) {
  if (rate === null) return '';
  const cls = rate >= 70 ? 'rate-good' : (rate >= 45 ? 'rate-mid' : 'rate-low');
  return '<span class="badge ' + cls + '">' + rate + '% approved</span>';
}

function renderEvents() {
  const done = loadJSON('stockplanner_done', {});
  const all = getAllEvents().slice().sort(function(a,b){ return daysUntil(a.date) - daysUntil(b.date); });
  let html = '<div class="section-label">Add a new event</div>';
  html += '<div class="card">' +
    '<span class="field-label">Event name</span>' +
    '<input type="text" id="ev-name" placeholder="e.g. Valentine Day">' +
    '<span class="field-label">Date</span>' +
    '<input type="date" id="ev-date">' +
    '<span class="field-label">Tags / theme ideas</span>' +
    '<input type="text" id="ev-tags" placeholder="e.g. hearts, romance metaphor">' +
    '<button class="btn" id="btn-add-event">Add event</button>' +
  '</div>';

  html += '<div class="section-label">Upcoming events <span class="event-count">' + all.length + '</span></div>';
  all.forEach(function(ev) {
    const d = daysUntil(ev.date);
    const isDone = !!done[ev.name];
    html += '<div class="card">' +
      (ev.builtin ? '' : '<div class="del" data-del-event="' + encodeURIComponent(ev.name) + '">&#10005;</div>') +
      '<div class="check ' + (isDone ? 'on' : '') + '" data-name="' + encodeURIComponent(ev.name) + '">' + (isDone ? '&#10003;' : '') + '</div>' +
      '<p class="card-title">' + ev.name + '</p>' +
      '<p class="card-meta">' + urgencyBadge(d) + (ev.range || ev.date) + '</p>' +
      '<p class="card-tags">' + (ev.tags||'') + '</p>' +
    '</div>';
  });
  return html;
}

function renderNiches() {
  let html = '<div class="section-label">Proven niches (by confidence)</div>';
  const sorted = NICHES_INFO.slice().sort(function(a,b){ return b.stars - a.stars; });
  sorted.forEach(function(n) {
    html += '<div class="card">' +
      '<p class="card-title">' + n.name + '</p>' +
      '<p class="niche-stars">' + '&#9733;'.repeat(n.stars) + '&#9734;'.repeat(5-n.stars) + '</p>' +
      '<p class="card-tags">' + n.note + '</p>' +
    '</div>';
  });
  return html;
}

function computeTotals(entries) {
  let gen=0, app=0, rej=0, sales=0;
  entries.forEach(function(e) {
    gen += (e.generated||0); app += (e.approved||0); rej += (e.rejected||0); sales += (e.sales||0);
  });
  const reviewed = app + rej;
  const rate = reviewed > 0 ? Math.round((app / reviewed) * 100) : null;
  return { gen: gen, app: app, rej: rej, sales: sales, rate: rate };
}

function renderTracker() {
  const entries = loadJSON('stockplanner_entries', []);
  const today = new Date().toISOString().slice(0,10);
  const options = getAllTrackOptions();
  const optionsHtml = options.map(function(n) { return '<option value="' + n.replace(/"/g,'&quot;') + '">' + n + '</option>'; }).join('');

  let html = '<div class="section-label">Log a batch</div>';
  html += '<div class="card">' +
    '<p class="note">Tip: tapping the copy icon in Batches already auto-counts "generated" for today. Use this form to add approved / rejected / sales once you know the results — pick the same name from the dropdown.</p>' +
    '<span class="field-label">Niche / Event</span>' +
    '<select id="in-niche">' + optionsHtml + '</select>' +
    '<span class="field-label">Date</span>' +
    '<input type="date" id="in-date" value="' + today + '">' +
    '<span class="field-label">Generated / Approved / Rejected</span>' +
    '<div class="row3">' +
      '<input type="number" id="in-gen" min="0" placeholder="Gen">' +
      '<input type="number" id="in-app" min="0" placeholder="Appr">' +
      '<input type="number" id="in-rej" min="0" placeholder="Rej">' +
    '</div>' +
    '<span class="field-label">Sales (optional)</span>' +
    '<div class="row2">' +
      '<input type="number" id="in-sales" min="0" placeholder="Sales count">' +
      '<input type="number" id="in-earn" min="0" step="0.01" placeholder="Earnings $">' +
    '</div>' +
    '<span class="field-label">Note (optional)</span>' +
    '<input type="text" id="in-note" placeholder="e.g. Movember batch, events1-">' +
    '<button class="btn" id="btn-add">Add entry</button>' +
  '</div>';

  const byNiche = {};
  entries.forEach(function(e) {
    if (!byNiche[e.niche]) byNiche[e.niche] = [];
    byNiche[e.niche].push(e);
  });

  const overall = computeTotals(entries);
  let overallEarn = 0;
  entries.forEach(function(e){ overallEarn += (e.earnings||0); });

  html += '<div class="section-label">Overall totals</div>';
  html += '<div class="card"><div class="totals-grid">' +
    '<div><span class="totals-num">' + overall.gen + '</span><span class="totals-label">Generated</span></div>' +
    '<div><span class="totals-num">' + overall.app + '</span><span class="totals-label">Approved</span></div>' +
    '<div><span class="totals-num">' + overall.sales + '</span><span class="totals-label">Sales</span></div>' +
    '<div><span class="totals-num">$' + overallEarn.toFixed(2) + '</span><span class="totals-label">Earnings</span></div>' +
  '</div></div>';

  html += '<div class="section-label">By niche / event</div>';
  const nicheKeys = Object.keys(byNiche);
  if (nicheKeys.length === 0) {
    html += '<div class="empty">No entries yet — add your first batch above.</div>';
  } else {
    nicheKeys.sort(function(a,b) {
      const ta = computeTotals(byNiche[a]), tb = computeTotals(byNiche[b]);
      return (tb.rate||0) - (ta.rate||0);
    }).forEach(function(niche) {
      const t = computeTotals(byNiche[niche]);
      html += '<div class="card">' +
        '<p class="card-title">' + niche + '</p>' +
        '<p class="card-meta">' + rateBadge(t.rate) +
          (t.sales > 0 ? '<span class="badge sales">' + t.sales + ' sales</span>' : '') +
          '<span class="entry-numbers">' + t.gen + ' gen, ' + t.app + ' appr, ' + t.rej + ' rej</span></p>';
      byNiche[niche].slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(e) {
        html += '<div class="entry-row" style="margin-top:6px; border-top:1px solid var(--border); padding-top:6px;">' +
          '<span class="entry-numbers">' + e.date + (e.note ? ' — ' + e.note : '') + '</span>' +
          '<span class="entry-numbers">' + e.generated + '/' + e.approved + '/' + e.rejected +
            (e.sales ? ' · ' + e.sales + ' sold' : '') + '</span>' +
        '</div>';
      });
      html += '</div>';
    });
  }

  html += '<button class="btn secondary" id="btn-clear">Clear all tracker data</button>';
  return html;
}

  const customEvents = loadJSON('stockplanner_custom_events', []);

  let statusHtml;

function rotatingNiches(count) {
  const top = NICHES_INFO.filter(function(n){ return n.stars >= 4; });
  const dayIndex = Math.floor(new Date().getTime() / 86400000);
  const picked = [];
  for (let i = 0; i < count && i < top.length; i++) {
    picked.push(top[(dayIndex + i) % top.length]);
  }
  return picked;
}

function renderAction() {
  const all = getAllEvents();
  const withDays = all.map(function(e){ return Object.assign({}, e, {d: daysUntil(e.date)}); });
  const urgent = withDays.filter(function(e){ return e.d >= 0 && e.d <= 35; }).sort(function(a,b){ return a.d - b.d; });
  const upcoming = withDays.filter(function(e){ return e.d > 35 && e.d <= 70; }).sort(function(a,b){ return a.d - b.d; });

  const topEvent = urgent[0];
  const evergreenPicks = rotatingNiches(topEvent ? 2 : 4);
  let suggestionText, suggestionHtml;

  if (topEvent) {
    const eventCount = 10, evergreenCount = 10;
    suggestionText = "Generate today's batch: " + eventCount + " prompts themed around \"" + topEvent.name + "\" (" + (topEvent.tags||'') + "), plus " + evergreenCount + " evergreen prompts from: " + evergreenPicks.map(function(n){return n.name;}).join(' / ') + ". Follow the usual qualifier format and keyword/category rules.";
    suggestionHtml = '<p class="card-title">Today\'s suggested batch &mdash; 20 prompts</p>' +
      '<p class="card-tags"><b>' + eventCount + '</b> themed around <b>' + topEvent.name + '</b> (' + urgencyBadge(topEvent.d) + ')<br>' +
      '<span style="font-size:11.5px;">' + (topEvent.tags||'') + '</span></p>' +
      '<p class="card-tags" style="margin-top:8px;"><b>' + evergreenCount + '</b> evergreen, rotating today\'s picks:<br>' +
      evergreenPicks.map(function(n){ return '&#9733; ' + n.name; }).join('<br>') + '</p>';
  } else {
    suggestionText = "Generate today's batch: 20 evergreen prompts rotating across: " + evergreenPicks.map(function(n){return n.name;}).join(' / ') + ". Follow the usual qualifier format and keyword/category rules.";
    suggestionHtml = '<p class="card-title">Today\'s suggested batch &mdash; 20 prompts</p>' +
      '<p class="card-tags">No urgent event right now &mdash; full evergreen mix, rotating today\'s picks:<br>' +
      evergreenPicks.map(function(n){ return '&#9733; ' + n.name; }).join('<br>') + '</p>';
  }

  let html = '<div class="section-label">Today\'s plan</div>';
  html += '<div class="card" style="border: 1.5px solid var(--accent);">' + suggestionHtml +
    '<button class="btn" id="btn-copy-suggestion" data-suggestion="' + encodeURIComponent(suggestionText) + '">Copy instruction for Claude</button>' +
    '<p class="note" id="suggestion-status" style="display:none;">Copied! Paste this into your chat with Claude.</p>' +
  '</div>';

  html += '<div class="section-label">Work on this now</div>';
  if (urgent.length === 0) {
    html += '<div class="empty">No event within the next 35 days. Focus on proven evergreen niches below.</div>';
  } else {
    urgent.forEach(function(ev) {
      const batch = BATCHES.find(function(b){ return b.covers.indexOf(ev.name) !== -1; });
      html += '<div class="card">' +
        '<p class="card-title">' + ev.name + '</p>' +
        '<p class="card-meta">' + urgencyBadge(ev.d) + (ev.range||ev.date) + '</p>' +
        '<p class="card-tags">' + (ev.tags||'') + '</p>' +
        (batch ? '<p class="note">A batch already exists for this — see "' + batch.name + '" in the Batches tab.</p>' : '<p class="note">No batch made yet — ask Claude to generate prompts for this event.</p>') +
      '</div>';
    });
  }

  html += '<div class="section-label">Coming up (35-70 days out)</div>';
  if (upcoming.length === 0) {
    html += '<div class="empty">Nothing in this window yet.</div>';
  } else {
    upcoming.forEach(function(ev) {
      html += '<div class="card">' +
        '<p class="card-title">' + ev.name + '</p>' +
        '<p class="card-meta">' + urgencyBadge(ev.d) + (ev.range||ev.date) + '</p>' +
      '</div>';
    });
  }

  html += '<div class="section-label">Always keep in the mix</div>';
  html += '<div class="card"><p class="card-tags">Strategy: roughly 50% proven evergreen niches (literal lifestyle, guidance metaphor, distinct-shape glass) + 50% event/trending. Top proven niches:</p>';
  NICHES_INFO.filter(function(n){ return n.stars >= 4; }).forEach(function(n) {
    html += '<p class="card-tags">&#9733; ' + n.name + '</p>';
  });
  html += '</div>';

  return html;
}

  return html;
}

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function renderBatches() {
  let html = '<div class="section-label">Past batches</div>';
  BATCHES.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(b, i) {
    const autoCount = todaysAutoCount(b.name);
    html += '<div class="card">' +
      '<p class="card-title">' + b.name + '</p>' +
      '<p class="card-meta">' + b.date + (autoCount > 0 ? ' <span class="badge sales">' + autoCount + ' copied today</span>' : '') + '</p>' +
      '<p class="card-tags"><b>Covers:</b> ' + b.covers.join(', ') + '</p>';

    if (b.prompts_list && b.prompts_list.length) {
      html += '<details style="margin-top:10px;" open><summary style="cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600;">' + b.prompts_list.length + ' prompts &mdash; tap to copy</summary>' +
        '<div style="margin-top:10px;">';
      b.prompts_list.forEach(function(p, pi) {
        html += '<div class="prompt-row">' +
          '<span class="prompt-text">' + (pi+1) + '. ' + p.replace(/</g,'&lt;') + '</span>' +
          '<button class="copy-btn" data-batch="' + i + '" data-idx="' + pi + '" title="Copy">' + COPY_ICON + '</button>' +
        '</div>';
      });
      html += '</div></details>';
    } else if (b.prompts) {
      html += '<details style="margin-top:8px;"><summary style="cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600;">View prompts</summary>' +
        '<pre style="white-space:pre-wrap; font-size:11.5px; color:var(--text-secondary); margin-top:8px; font-family:inherit;">' + b.prompts.replace(/</g,'&lt;') + '</pre>' +
      '</details>';
    }

    html += '<button class="btn outline" data-dl-csv="' + i + '" style="margin-top:10px;">Download CSV</button>' +
    '</div>';
  });
  return html;
}

function render(tab) {
  const main = document.getElementById('main');
  if (tab === 'action') main.innerHTML = renderAction();
  else if (tab === 'events') main.innerHTML = renderEvents();
  else if (tab === 'niches') main.innerHTML = renderNiches();
  else if (tab === 'tips') main.innerHTML = renderTips();
  else if (tab === 'batches') main.innerHTML = renderBatches();
  else if (tab === 'tracker') main.innerHTML = renderTracker();
  else main.innerHTML = renderExport();

  if (tab === 'action') {
    const btn = document.getElementById('btn-copy-suggestion');
    if (btn) {
      btn.addEventListener('click', async function() {
        const text = decodeURIComponent(btn.getAttribute('data-suggestion'));
        try { await navigator.clipboard.writeText(text); }
        catch(e) {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch(e2) {}
          document.body.removeChild(ta);
        }
        const status = document.getElementById('suggestion-status');
        if (status) status.style.display = 'block';
      });
    }
  }

  if (tab === 'events') {
    main.querySelectorAll('.check').forEach(function(el) {
      el.addEventListener('click', function() {
        const name = decodeURIComponent(el.getAttribute('data-name'));
        const done = loadJSON('stockplanner_done', {});
        done[name] = !done[name];
        saveJSON('stockplanner_done', done);
        render('events');
      });
    });
    main.querySelectorAll('[data-del-event]').forEach(function(el) {
      el.addEventListener('click', function() {
        const name = decodeURIComponent(el.getAttribute('data-del-event'));
        let custom = loadJSON('stockplanner_custom_events', []);
        custom = custom.filter(function(e){ return e.name !== name; });
        saveJSON('stockplanner_custom_events', custom);
        render('events');
      });
    });
    const addEvBtn = document.getElementById('btn-add-event');
    if (addEvBtn) {
      addEvBtn.addEventListener('click', function() {
        const name = document.getElementById('ev-name').value.trim();
        const date = document.getElementById('ev-date').value;
        const tags = document.getElementById('ev-tags').value.trim();
        if (!name || !date) { return; }
        const custom = loadJSON('stockplanner_custom_events', []);
        custom.push({ name: name, date: date, tags: tags });
        saveJSON('stockplanner_custom_events', custom);
        render('events');
      });
    }
  }

  if (tab === 'tracker') {
    const addBtn = document.getElementById('btn-add');
    if (addBtn) {
      addBtn.addEventListener('click', function() {
        const niche = document.getElementById('in-niche').value;
        const date = document.getElementById('in-date').value || new Date().toISOString().slice(0,10);
        const gen = parseInt(document.getElementById('in-gen').value || '0', 10);
        const app = parseInt(document.getElementById('in-app').value || '0', 10);
        const rej = parseInt(document.getElementById('in-rej').value || '0', 10);
        const sales = parseInt(document.getElementById('in-sales').value || '0', 10);
        const earnings = parseFloat(document.getElementById('in-earn').value || '0');
        const note = document.getElementById('in-note').value || '';
        if (gen===0 && app===0 && rej===0 && sales===0 && earnings===0) { return; }
        const entries = loadJSON('stockplanner_entries', []);
        entries.push({ niche: niche, date: date, generated: gen, approved: app, rejected: rej, sales: sales, earnings: earnings, note: note });
        saveJSON('stockplanner_entries', entries);
        render('tracker');
      });
    }
    const clearBtn = document.getElementById('btn-clear');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        if (confirm('Clear all tracker entries? This cannot be undone.')) {
          saveJSON('stockplanner_entries', []);
          render('tracker');
        }
      });
    }
  }

  if (tab === 'batches') {
    main.querySelectorAll('.copy-btn').forEach(function(el) {
      el.addEventListener('click', async function() {
        const bIdx = parseInt(el.getAttribute('data-batch'), 10);
        const pIdx = parseInt(el.getAttribute('data-idx'), 10);
        const text = BATCHES[bIdx].prompts_list[pIdx];
        try {
          await navigator.clipboard.writeText(text);
        } catch(e) {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch(e2) {}
          document.body.removeChild(ta);
        }
        incrementGenerated(BATCHES[bIdx].name);
        const original = el.innerHTML;
        el.innerHTML = CHECK_ICON;
        el.classList.add('copied');
        const badgeHost = el.closest('.card').querySelector('.card-meta');
        const newCount = todaysAutoCount(BATCHES[bIdx].name);
        if (badgeHost && !badgeHost.querySelector('.badge')) {
          badgeHost.insertAdjacentHTML('beforeend', ' <span class="badge sales">' + newCount + ' copied today</span>');
        } else if (badgeHost) {
          const badgeEl = badgeHost.querySelector('.badge');
          if (badgeEl) badgeEl.textContent = newCount + ' copied today';
        }
        setTimeout(function() { el.innerHTML = original; el.classList.remove('copied'); }, 1200);
      });
    });
    main.querySelectorAll('[data-dl-csv]').forEach(function(el) {
      el.addEventListener('click', async function() {
        const idx = parseInt(el.getAttribute('data-dl-csv'), 10);
        const b = BATCHES[idx];
        try {
          const downloads = await claude.use("downloads");
          if (downloads) {
            await downloads.save({ filename: b.csv_filename || (b.name + '.csv'), data: b.csv });
            return;
          }
        } catch(e) {}
        // fallback: copy to clipboard
        try {
          await navigator.clipboard.writeText(b.csv);
          alert('Download not available here — the CSV was copied to your clipboard instead. Paste it into a new file named "' + (b.csv_filename||'batch.csv') + '".');
        } catch(e2) {
          alert('Could not download or copy automatically. Ask Claude to resend this CSV in chat.');
        }
      });
    });
  }

  if (tab === 'export') {
    const copyBtn = document.getElementById('btn-copy');
    const statusEl = document.getElementById('export-status');
    if (copyBtn) {
      copyBtn.addEventListener('click', function() {
        const area = document.getElementById('export-area');
        area.select();
        try {
          navigator.clipboard.writeText(area.value).then(function(){
            statusEl.textContent = 'Copied! Paste it in your chat with Claude.';
          }).catch(function(){
            document.execCommand('copy');
            statusEl.textContent = 'Copied! Paste it in your chat with Claude.';
          });
        } catch(e) {
          try { document.execCommand('copy'); statusEl.textContent = 'Copied!'; }
          catch(e2) { statusEl.textContent = 'Could not copy automatically — select the text above and copy manually.'; }
        }
      });
    }
    const dlBtn = document.getElementById('btn-download');
    if (dlBtn) {
      dlBtn.addEventListener('click', async function() {
        const area = document.getElementById('export-area');
        try {
          const downloads = await claude.use("downloads");
          if (downloads) {
            await downloads.save({ filename: "stock-planner-export.json", data: area.value });
            statusEl.textContent = 'Download requested — check the save prompt.';
            return;
          }
        } catch(e) {}
        statusEl.textContent = 'Direct download is not available here — use "Copy to clipboard" instead and paste it to Claude or into a note.';
      });
    }
  }
}

function selectTab(tabName) {
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
  document.querySelectorAll('.hicon').forEach(function(x){ x.classList.remove('active'); });
  const navTab = document.querySelector('.tab[data-tab="' + tabName + '"]');
  const hIcon = document.querySelector('.hicon[data-tab="' + tabName + '"]');
  if (navTab) navTab.classList.add('active');
  if (hIcon) hIcon.classList.add('active');
  render(tabName);
  window.scrollTo(0, 0);
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() { selectTab(t.getAttribute('data-tab')); });
});
document.querySelectorAll('.hicon').forEach(function(t) {
  t.addEventListener('click', function() { selectTab(t.getAttribute('data-tab')); });
});

selectTab('action');
initCloudSync();
</script>

</body>
